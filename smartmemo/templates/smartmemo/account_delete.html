{% extends "smartmemo/base.html" %}

{% block title %}
アカウント削除
{% endblock %}

{% block content %}
<div class="container">

    <div class="row justify-content-center">
        
        <div class="col-md-6">

            <div class="card-body">

                <div class="card login-card">

                    <h2 class="login-title text-danger">
                        アカウント削除
                    </h2>
                    <div class="alert alerf-danger">
                        ⚠️アカウント削除すると、すべてのメモも完全に削除されます。
                    </div>

                    {% if error %}
                    <div class="alert alert-danger">
                        ⚠️{{ error }}
                    </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">現在のパスワード</label>
                            <input type="password" name="password" class="form-control" placeholder="現在のパスワード" required>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-danger" onclick="return confirm('本当にアカウントを削除しますか？この操作は取り消せません。')">
                                アカウント削除
                            </button>
                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
{% endblock %}
