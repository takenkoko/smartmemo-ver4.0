{% extends "smartmemo/base.html" %}

{% block title %}
プロフィール
{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        
        <div class="col-md-6">

            <div class="card login-card">

                <div class="card-body">

                    <h2 class="login-title">
                        プロフィール
                    </h2>

                    <div class="text-center mb-4">
                        {% if user.profile.icon %}
                          <img src="{{ user.profile.icon.url }}" alt="プロフィール画像" class="rounded-circle" style="width: 120px; height: 120px; object-fit: cover;">
                        {% else %}
                          <p class="text-muted">画像未設定</p>
                        {% endif %}
                    </div>

                    <table class="table">

                        <tr>
                            <th>ユーザー名</th>
                            <td>{{ user.username }}</td>
                        </tr>

                        <tr>
                            <th>メールアドレス</th>
                            <td>{{ user.email }}</td>
                        </tr>
                        
                        <tr>
                            <th>登録日</th>
                            <td>{{ user.date_joined|date:"Y年n月j日 H:i " }}</td>
                        </tr>

                    </table>
                    <!--プロフィール編集へ-->
                    <div class="text-cender mt-4">
                        <a href="{% url 'profile_edit' %}" class="btn btn-outline-primary">
                            プロフィール編集
                        </a>
                         <!--パスワード変更へ-->
                         <a href="{% url 'password_change' %}" class="btn btn-outline-secondary">
                            パスワード変更
                         </a>
                         <!--アカウント削除-->
                         <a href="{% url 'account_delete' %}" class="btn btn-outline-danger">
                            アカウント削除
                         </a>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
{% endblock %}
